<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Producto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="/restaurante/css/inventario.css">
</head>
<body>

<nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item">
            LO MAS RICO
        </a>
    </div>

    <div class="navbar-menu">
        <div class="navbar-start">
            <a class="navbar-item">Home</a>
            <a class="navbar-item">Documentation</a>

            <div class="navbar-item has-dropdown is-hoverable">
                <a class="navbar-link">More</a>

                <div class="navbar-dropdown">
                    <a class="navbar-item">About</a>
                    <a class="navbar-item is-selected">Jobs</a>

                    <a class="navbar-item">Report an issue</a>
                </div>
            </div>
        </div>

</nav>

  <div class="contenedor">
    <center><h1 class="titulo">Registro de Producto</h1></center>

    <form class="formulario">

<center> 
      <label class="etiqueta" for="codigo_producto">
        Código del Producto:
      </label><br>
      <input class="campo" type="text" id="codigo_producto" name="codigo_producto">
      <br><br>

      <label class="etiqueta" for="nombre_producto">
        Nombre del Producto:
      </label><br>
      <input class="campo" type="text" id="nombre_producto" name="nombre_producto">
      <br><br>

      <label class="etiqueta" for="precio_unitario">
        Precio Unitario:
      </label><br>
      <input class="campo" type="number" id="precio_unitario" name="precio_unitario">
      <br><br>

      <label class="etiqueta" for="cantidad_producto">
        Cantidad del Producto:
      </label><br>
      <input class="campo" type="number" id="cantidad_producto" name="cantidad_producto">
      <br><br>

      <label class="etiqueta" for="marca_producto">
        Marca del Producto:
      </label><br>
      <input class="campo" type="text" id="marca_producto" name="marca_producto">
      <br><br>

      <label class="etiqueta" for="categoria_producto">
        Categoría del Producto:
      </label><br>
      <input class="campo" type="text" id="categoria_producto" name="categoria_producto">
      <br><br>

      <label class="etiqueta" for="unidad_medida">
        Unidad de Medida:
      </label><br>
      <input class="campo" type="text" id="unidad_medida" name="unidad_medida">
      <br><br>

      <button class="boton" type="submit">
        Guardar Producto
      </button>
</center>
    </form>
  </div>

</body>
</html>
