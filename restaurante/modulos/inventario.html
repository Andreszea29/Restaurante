<div id="contenedor">
    <center><h1 id="titulo">Registro de Producto</h1></center>

    <form id="formulario">

        <center>

            <label class="etiqueta" for="codigo_producto">
                Código del Producto:
            </label><br>
            <input type="text" id="codigo_producto" name="codigo_producto">
            <br><br>

            <label class="etiqueta" for="nombre_producto">
                Nombre del Producto:
            </label><br>
            <input type="text" id="nombre_producto" name="nombre_producto">
            <br><br>

            <label class="etiqueta" for="precio_unitario">
                Precio Unitario:
            </label><br>
            <input type="number" id="precio_unitario" name="precio_unitario">
            <br><br>

            <label class="etiqueta" for="cantidad_producto">
                Cantidad del Producto:
            </label><br>
            <input type="number" id="cantidad_producto" name="cantidad_producto">
            <br><br>

            <label class="etiqueta" for="marca_producto">
                Marca del Producto:
            </label><br>
            <input type="text" id="marca_producto" name="marca_producto">
            <br><br>

            <label class="etiqueta" for="categoria_producto">
                Categoría del Producto:
            </label><br>
            <input type="text" id="categoria_producto" name="categoria_producto">
            <br><br>

            <label class="etiqueta" for="unidad_medida">
                Unidad de Medida:
            </label><br>
            <input type="text" id="unidad_medida" name="unidad_medida">
            <br><br>

      
<div class="field is-grouped">
  <div class="control">
    <button class="button is-link" type="button" onclick="validarDatos()">Enviar</button>
  </div>

  <div class="control">
    <button class="button is-light" type="reset">Cancelar</button>
  </div>
</div>

        </center>

    </form>
</div>
